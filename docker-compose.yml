services:
  postgres:
    image: postgres:16
    container_name: banking-investigator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_investigator
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d banking_investigator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
